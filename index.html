<!doctype html>
<html lang="es" data-tema="oscuro">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#4d1219" />
    <meta name="color-scheme" content="dark light" />
    <script>
      // Pinta la apariencia elegida antes de cargar la app, sin parpadeo. Por defecto, oscura.
      // La preferencia real está en la base; esta copia la escribe src/tema.ts.
      try {
        var a = localStorage.getItem('mahamudra-apariencia');
        var claro =
          a === 'clara' || (a === 'automatica' && !matchMedia('(prefers-color-scheme: dark)').matches);
        if (claro) document.documentElement.dataset.tema = 'claro';
      } catch (e) {}
    </script>
    <meta name="description" content="Acompaña y registra la práctica diaria del programa de Mahamudra." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Mahamudra" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>Mahamudra</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
